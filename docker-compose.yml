services:
  # Gateway mode. The API key arrives per request on X-Meraki-Api-Key.
  # Do not set MERAKI_API_KEY, MERAKI_ORG_ID, or env_file here — that would put
  # static vendor credentials in the container. The project .env is used only
  # for Compose interpolation of CONDUIT_S2S_SECRET. For AUTH_MODE=env, pass
  # MERAKI_API_KEY on that process instead (see the README).
  meraki-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8080
      - AUTH_MODE=gateway
      - READ_ONLY_MODE=true
      - LOG_LEVEL=info
      - NODE_ENV=production
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
